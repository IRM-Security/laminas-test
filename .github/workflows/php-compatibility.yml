name: PHP compatibility

on:
  push:
    branches: ['feature/SYN-50799-php84-phpunit9']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: xdebug
          tools: composer:v2
      - run: composer config platform.php '${{ matrix.php }}.0'
      - run: composer require --no-update --no-interaction phpunit/phpunit:^9.6
      - run: composer update --no-plugins --no-scripts --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --stderr --fail-on-warning --coverage-clover coverage.xml
